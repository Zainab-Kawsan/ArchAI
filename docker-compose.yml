services:
  backend:
    build:
      context: ./ai-service
    container_name: archai-backend
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env

  frontend:
    build:
      context: ./web-app
    container_name: archai-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
